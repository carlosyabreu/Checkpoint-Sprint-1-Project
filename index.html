<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>Shared bookmarks</title>
    <style>
      /* Minimal styling - focus on functionality */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        padding: 20px;
        max-width: 800px;
        margin: 0 auto;
      }
      .form-group {
        margin-bottom: 15px;
      }
      label {
        display: block;
        margin-bottom: 5px;
        font-weight: 500;
      }
      input,
      textarea {
        width: 100%;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      button {
        padding: 8px 16px;
        cursor: pointer;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
      }
      button:hover {
        background: #0056b3;
      }
      .bookmark {
        border: 1px solid #ddd;
        padding: 15px;
        margin-bottom: 10px;
        border-radius: 4px;
      }
      .bookmark-title {
        font-size: 1.1em;
        margin-bottom: 5px;
      }
      .bookmark-description {
        color: #666;
        margin-bottom: 5px;
      }
      .bookmark-timestamp {
        font-size: 0.8em;
        color: #999;
        margin-bottom: 10px;
      }
      .bookmark-actions {
        display: flex;
        gap: 10px;
        margin-top: 10px;
      }
      .like-button {
        background: #dc3545;
      }
      .like-button:hover {
        background: #c82333;
      }
      .copy-button {
        background: #28a745;
      }
      .copy-button:hover {
        background: #218838;
      }
      select {
        width: 100%;
        padding: 10px;
        margin-bottom: 20px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      .empty-message {
        text-align: center;
        padding: 40px;
        color: #666;
        background: #f9f9f9;
        border-radius: 4px;
      }
      h2 {
        margin-top: 20px;
        margin-bottom: 10px;
      }
    </style>
    <script type="module" src="script.js"></script>
  </head>
  <body>
    <h1>Shared bookmarks</h1>

    <!-- User dropdown -->
    <div class="form-group">
      <label for="userSelect">Select user:</label>
      <select
        id="userSelect"
        aria-label="Select user to view their bookmarks">
        <option value="">Loading users...</option>
        <option value="user1">User 1</option>
        <option value="user2">User 2</option>
        <option value="user3">User 3</option>
        <option value="user4">User 4</option>
        <option value="user5">User 5</option>
      </select>
    </div>

    <!-- Bookmark list container -->
    <div id="bookmarksContainer" aria-live="polite">
      <!-- Bookmarks will be rendered here -->
    </div>

    <!-- Form for adding bookmarks -->
    <!-- In footer so that it remains in view, however long the bookmarks page may become -->

    <h2>Add new bookmark</h2>
    <form
      id="bookmarkForm"
      aria-label="Add new bookmark form">
      <div class="form-group">
        <label for="urlInput">URL:</label>
        <input
          type="url"
          id="urlInput"
          name="url"
          required
          placeholder="https://example.com"
          aria-required="true" />
      </div>

      <div class="form-group">
        <label for="titleInput">Title:</label>
        <input
          type="text"
          id="titleInput"
          name="title"
          required
          placeholder="Bookmark title"
          aria-required="true" />
      </div>

      <div class="form-group">
        <label for="descriptionInput">Description:</label>
        <textarea
          id="descriptionInput"
          name="description"
          rows="3"
          placeholder="Enter description"
          aria-required="true"></textarea>
      </div>

      <button type="submit">Add bookmark</button>
    </form>
  </body>
</html>
